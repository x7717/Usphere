name: worldgen-tests
# Boots a real Paper 26.3 server with the Usphere packs and verifies worldgen via RCON.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Paper 26.3
        run: |
          URL=$(curl -sS "https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest" | python3 -c "
import json,sys
d = json.load(sys.stdin)
dl = d.get('downloads') or {}
e = dl.get('server:default') or list(dl.values())[0]
print(e['url'])")
          curl -sSL -o paper.jar "$URL"
          echo "eula=true" > eula.txt
          printf '%s\n' 'enable-rcon=true' 'rcon.port=25575' 'rcon.password=usphere-ci' \
            'level-seed=31337' 'online-mode=false' 'view-distance=6' 'simulation-distance=5' > server.properties
          mkdir -p world/datapacks
          cp lithosphere-1.8.2-26.3.zip world/datapacks/usphere-1-core.zip
          cp usphere-nature-0.3-26.3.zip world/datapacks/usphere-2-nature.zip

      - name: Start server and wait for Done
        run: |
          java -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "Done (" server.log; then echo "SERVER UP"; break; fi
            if grep -q "Failed to load registries\|Failed to load datapacks" server.log; then
              echo "::error::datapack load failure"
              grep -A5 "Failed to parse\|Unbound\|StackOverflow" server.log | head -40
              exit 1
            fi
            sleep 3
          done
          grep -q "Done (" server.log || { echo "::error::server did not start"; tail -50 server.log; exit 1; }

      - name: Verify packs and worldgen (RCON)
        run: |
          python3 - << 'PY'
          import socket, struct, time
          class R:
              def __init__(s, h, p, pw):
                  s.s = socket.create_connection((h, p), 10); s.i = 0
                  s.send(3, pw)
              def send(s, t, pay):
                  s.i += 1
                  d = struct.pack("<ii", s.i, t) + pay.encode() + b"\x00\x00"
                  s.s.sendall(struct.pack("<i", len(d)) + d)
              def cmd(s, c):
                  s.send(2, c); time.sleep(0.6)
                  ln = struct.unpack("<i", s.recvn(4))[0]
                  d = s.recvn(ln)
                  return d[8:-2].decode()
              def recvn(s, n):
                  b = b""
                  while len(b) < n: b += s.s.recv(n - len(b))
                  return b
          r = R("127.0.0.1", 25575, "usphere-ci")
          out = r.cmd("datapack list")
          print(out); assert "usphere-1-core" in out and "usphere-2-nature" in out, "packs not enabled"
          for b in ["still_life:bayou", "still_life:cacti_savanna", "minecraft:plains"]:
              o = r.cmd(f"locate biome {b}"); print(o)
              assert "Could not find" not in o and "Can't find" not in o, f"biome {b} not generated"
          o = r.cmd("locate structure minecraft:village_plains"); print(o)
          assert "Could not find" not in o, "village not found"
          print(r.cmd("forceload add -64 -64 63 63"))
          time.sleep(20)
          r.cmd("stop")
          print("ALL WORLDGEN CHECKS PASSED")
          PY

      - name: Scan server log for datapack errors
        run: |
          if grep -E "Failed to (parse|load registries)|Unbound values|StackOverflow" server.log; then
            echo "::error::datapack errors found in log"; exit 1
          fi
          echo "log clean"

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
