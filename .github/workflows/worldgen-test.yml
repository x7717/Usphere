name: worldgen-tests
# Usphere CI: (1) real Paper 26.3 server boots the datapacks and RCON-verifies
# worldgen; (2) a REAL Minecraft 26.3 client (Xvfb + llvmpipe + GLX shim)
# loads the world and captures screenshots.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Paper 26.3
        run: |
          URL=$(curl -sS "https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest" | python3 -c "import json,sys; d=json.load(sys.stdin); dl=d.get('downloads') or {}; e=dl.get('server:default') or list(dl.values())[0]; print(e['url'])")
          curl -sSL -o paper.jar "$URL"
          echo "eula=true" > eula.txt
          printf '%s\n' 'enable-rcon=true' 'rcon.port=25575' 'rcon.password=lithocheck' \
            'level-seed=31337' 'online-mode=false' 'view-distance=6' 'simulation-distance=5' \
            'level-name=world' > server.properties
          mkdir -p world/datapacks
          cp lithosphere-1.8.2-26.3.zip world/datapacks/usphere-1-core.zip
          cp usphere-nature-0.6-26.3.zip world/datapacks/usphere-2-nature.zip
          cp usphere-plus-0.1-26.3.zip world/datapacks/usphere-3-plus.zip
          cp usphere-rivers-0.1-26.3.zip world/datapacks/usphere-4-rivers.zip

      - name: Start server and wait for Done
        run: |
          java -Xmx3G -jar paper.jar --nogui > server.log 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "Done (" server.log; then echo "SERVER UP"; break; fi
            if grep -q "Failed to load registries\|Failed to load datapacks" server.log; then
              echo "::error::datapack load failure"
              grep -A5 "Failed to parse\|Unbound\|StackOverflow" server.log | head -40
              exit 1
            fi
            sleep 3
          done
          grep -q "Done (" server.log || { echo "::error::server did not start"; tail -50 server.log; exit 1; }

      - name: Worldgen verification (RCON)
        run: |
          python3 scripts/ci_server_tests.py --port 25575 --password lithocheck

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log

  client-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: server-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Xvfb + ImageMagick
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick

      - name: Build GLX shim (strip MSAA/sRGB/DirectColor for llvmpipe)
        run: |
          mkdir -p glshim
          gcc -shared -fPIC -O2 -DREAL_DEFAULT='"/lib/x86_64-linux-gnu/libGL.so.1"' scripts/glshim.c -o glshim/libGL.so.1 -ldl
          gcc -shared -fPIC -O2 -DREAL_DEFAULT='"/usr/lib/x86_64-linux-gnu/libGLX.so.0"' scripts/glshim.c -o glshim/libGLX.so.0 -ldl

      - name: Build screenshot agent
        run: |
          cd scripts/agent
          printf 'Premain-Class: ShotAgent2\n' > M2.MANIFEST
          javac ShotAgent2.java
          jar cfm shot-agent2.jar M2.MANIFEST ShotAgent2.class

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +extension RENDER +iglx &
          sleep 2

      - name: Prepare deterministic world (Paper 26.3 quickboot)
        run: |
          URL=$(curl -sS "https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest" | python3 -c "import json,sys; d=json.load(sys.stdin); dl=d.get('downloads') or {}; e=dl.get('server:default') or list(dl.values())[0]; print(e['url'])")
          curl -sSL -o paper.jar "$URL"
          echo "eula=true" > eula.txt
          printf '%s\n' 'level-seed=31337' 'online-mode=false' 'view-distance=6' 'simulation-distance=5' 'level-name=world' > server.properties
          mkdir -p world/datapacks
          cp lithosphere-1.8.2-26.3.zip world/datapacks/usphere-1-core.zip
          cp usphere-nature-0.6-26.3.zip world/datapacks/usphere-2-nature.zip
          cp usphere-plus-0.1-26.3.zip world/datapacks/usphere-3-plus.zip
          cp usphere-rivers-0.1-26.3.zip world/datapacks/usphere-4-rivers.zip
          java -Xmx3G -jar paper.jar --nogui > server.log 2>&1 &
          for i in $(seq 1 90); do
            grep -q "Done (" server.log && break
            grep -q "Failed to load" server.log && { tail -40 server.log; exit 1; }
            sleep 3
          done
          grep -q "Done (" server.log || { echo "::error::world prep failed"; tail -40 server.log; exit 1; }
          sleep 5
          pkill -f paper.jar || true
          sleep 3

      - name: Run real Minecraft 26.3 client (loads the world, screenshots)
        run: |
          export DISPLAY=:99
          export SDL_VIDEODRIVER=x11
          export MC_CLIENT_CACHE=$HOME/mc-client
          export MC_HEAP=2200M
          export GL_SHIM_LIBGL=$GITHUB_WORKSPACE/glshim
          python3 scripts/ci_run_client.py --world world --wait 1500 --out client-shots

      - name: Upload client screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots
          path: client-shots/
